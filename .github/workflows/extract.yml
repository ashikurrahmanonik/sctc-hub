name: Extract ZIP
on: { push: { paths: ['*.zip'] } }
permissions: { contents: write }
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for z in *.zip; do
            rm -rf /tmp/x; mkdir /tmp/x
            unzip -oq "$z" -x '.github/*' '*/.github/*' -d /tmp/x
            if [ "$(ls -A /tmp/x | wc -l)" = 1 ] && [ -d /tmp/x/* ]; then cp -a /tmp/x/*/. .; else cp -a /tmp/x/. .; fi
            git rm -q "$z"
          done
      - run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add -A; git commit -m "Extract zip" || exit 0; git push
