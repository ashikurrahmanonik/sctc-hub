name: Build APK
on:
  push: { branches: [main, master], paths-ignore: ['*.zip', 'README.md'] }
  workflow_run: { workflows: ['Extract ZIP'], types: [completed] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: { app: [admin, student] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/prep.cjs ${{ matrix.app }}
      - run: npm run build
        env:
          VITE_APP: ${{ matrix.app }}
          VITE_BUILD: ${{ github.run_number }}
          VITE_REPO: ${{ github.repository }}
      - run: npx cap add android
      - name: Android patches
        env: { BUILD_NUMBER: '${{ github.run_number }}' }
        run: pip install pillow && python3 scripts/smallicon.py && python3 scripts/android_patch.py ${{ matrix.app }}
      - name: Secrets
        env: { GS: '${{ secrets.GOOGLE_SERVICES_JSON }}', KS: '${{ secrets.DEBUG_KEYSTORE }}', APP: '${{ matrix.app }}' }
        run: |
          test -n "$GS" || { echo "Add GOOGLE_SERVICES_JSON secret"; exit 1; }
          test -n "$KS" || { echo "Add DEBUG_KEYSTORE secret (needed so app updates can install)"; exit 1; }
          printf '%s' "$GS" > android/app/google-services.json
          PKG=hub; [ "$APP" = "admin" ] && PKG=admin
          grep -q "bd.pro.sabujcomputers.$PKG" android/app/google-services.json || { echo "google-services.json has no app bd.pro.sabujcomputers.$PKG"; exit 1; }
          echo "$KS" | tr -d ' \r\n' | base64 -d > android/app/sctc.keystore
          FP=$(keytool -list -v -keystore android/app/sctc.keystore -storepass android -alias androiddebugkey | grep -i "SHA1:" | head -1 | sed 's/.*SHA1: *//')
          echo "Keystore SHA-1: $FP"
          [ "$FP" = "6A:25:6B:D7:93:4C:B4:6E:75:C0:78:B2:F1:60:DA:38:53:5A:08:25" ] || { echo "DEBUG_KEYSTORE secret is wrong (SHA-1 does not match). Paste the full text of 6_DEBUG_KEYSTORE_secret.txt"; exit 1; }
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found, skipping check"; exit 0; fi
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep -qi "6a256bd7934cb46e75c078b2f160da38535a0825" || { echo "APK is NOT signed with the fixed key"; exit 1; }
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.app }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.app }}
          name: build ${{ github.run_number }}
          files: ${{ matrix.app }}.apk
